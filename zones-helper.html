<!doctype html><meta charset="utf-8"><title>zones helper</title>
<script>
// Служебная страница: приложение shuster.pomoshnik.ai присылает картинку, страница отправляет её в Gemini через прокси «Помощника» с входом пользователя.
const OK=['https://shuster.pomoshnik.ai','http://localhost:8765'];
addEventListener('message',async e=>{
  if(!OK.includes(e.origin))return;const m=e.data||{};if(m.type!=='zones')return;
  const reply=d=>e.source.postMessage(Object.assign({type:'zones-res',id:m.id},d),e.origin);
  try{
    let s=null;try{s=JSON.parse(localStorage.getItem('session'))}catch(_){}
    if(!s||!s.user){reply({error:'login'});return}
    const cfg=await (await fetch('/config.json',{cache:'no-store'})).json();
    // сервер сам ждёт Gemini (async), страница забирает ответ через /analyze-job: связь не рвётся на 2 минутах
    const au={'X-User':encodeURIComponent(s.user),'X-Pass':encodeURIComponent(s.password||'')};
    const r=await fetch(cfg.proxy+'/analyze',{method:'POST',referrerPolicy:'no-referrer',headers:Object.assign({'X-Meta':encodeURIComponent(JSON.stringify({mime:'image/jpeg',prompt:m.prompt,async:true}))},au),body:new Blob([m.buf],{type:'image/jpeg'})});
    const j=await r.json();if(!r.ok||!j.job){reply({error:j.error||('http '+r.status)});return}
    const t0=Date.now();
    while(Date.now()-t0<600000){
      await new Promise(f=>setTimeout(f,4000));
      let d=null;try{d=await (await fetch(cfg.proxy+'/analyze-job?id='+j.job,{referrerPolicy:'no-referrer',headers:au})).json()}catch(_){continue}
      if(d&&d.done){if(d.error)reply({error:d.error});else reply({text:d.text||''});return}
    }
    reply({error:'timeout'});
  }catch(err){reply({error:String(err)})}
});
parent.postMessage({type:'zones-ready'},'*');
</script>
