<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<link rel="manifest" href="./manifest.webmanifest">
<title>Советник</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#1b222c;--text:#edf2f7;--muted:#9ca8b8;--accent:#79c8a3;--line:#303b49;--idea:#d9a84f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:3;height:64px;background:#11151cf2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;backdrop-filter:blur(10px)}h1{font-size:22px;margin:0}.actions{display:flex;gap:5px}button{border:0;border-radius:10px;background:var(--panel);color:var(--text);font:inherit;padding:10px 12px;cursor:pointer}button:disabled{opacity:.45}.icon{font-size:20px;padding:8px;background:transparent}.scan.busy .glass{display:none}.spin{display:none}.scan.busy .spin{display:inline-block;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}main{max-width:760px;margin:auto;padding:18px 12px 100px}.welcome{color:var(--muted);text-align:center;margin:38px 12px}.msg{display:flex;margin:9px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:11px 14px;border-radius:17px;background:var(--panel);line-height:1.42;overflow-wrap:anywhere}.user .bubble{background:#28513f}.system .bubble{color:var(--muted);font-size:15px}.idea{display:block;border:1px solid #755b29;border-left:5px solid var(--idea);border-radius:13px;background:#211e17;padding:14px;margin:13px 0}.idea.done{opacity:.45}.idea-title{font-weight:700;color:#f2cf7b;margin-bottom:7px}.time{font-size:12px;color:var(--muted);margin-top:8px}.idea-actions{display:flex;gap:8px;margin-top:12px}.idea-actions button{font-size:14px;padding:8px 10px}.speak{float:right;padding:2px 6px;background:transparent;color:var(--muted)}#composer{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#11151cf2;border-top:1px solid var(--line);padding:9px max(10px,calc((100% - 760px)/2 + 10px));display:flex;gap:7px;align-items:end;backdrop-filter:blur(10px)}textarea{resize:none;min-height:43px;max-height:130px;flex:1;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font:inherit;padding:9px 11px;outline:none}#drawer{position:fixed;z-index:10;right:0;top:0;bottom:0;width:min(92vw,430px);background:var(--bg);box-shadow:-8px 0 30px #0008;padding:18px;transform:translateX(105%);transition:.25s;overflow:auto}#drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center}.note{border-bottom:1px solid var(--line);padding:12px 0}.note button{float:right;padding:2px 7px;color:var(--muted)}.addnote{display:flex;gap:6px;margin-top:18px}.addnote input{min-width:0;flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.toast{position:fixed;z-index:20;bottom:78px;left:50%;transform:translateX(-50%);background:#273442;padding:10px 15px;border-radius:10px;display:none}
</style>
</head>
<body>
<header><h1>Советник</h1><div class="actions"><button class="icon scan" title="Найти сейчас"><span class="glass">⌕</span><span class="spin">◌</span><span class="scanword"></span></button><button class="icon" id="notesBtn" title="Заметки">☷</button><button class="icon" id="pushBtn" title="Уведомления">♧</button></div></header>
<main id="feed"></main>
<form id="composer"><button type="button" class="icon" id="mic">♩</button><textarea id="input" rows="1" placeholder="Напиши Советнику..."></textarea><button class="icon" title="Отправить">➤</button></form>
<aside id="drawer"><div class="drawer-head"><h2>Заметки</h2><button id="closeDrawer">×</button></div><div id="notesList"></div><form class="addnote" id="noteForm"><input id="noteInput" placeholder="Добавить заметку"><button>Добавить</button></form></aside><div class="toast" id="toast"></div>
<script>
const API="https://pomoshnik.jagser.deno.net", feedEl=document.querySelector("#feed"), input=document.querySelector("#input"), tokenKey="pa_token";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=localStorage.getItem(tokenKey), last=0, loading=false;
if(location.hash.startsWith("#k=")){token=decodeURIComponent(location.hash.slice(3));localStorage.setItem(tokenKey,token);history.replaceState(null,"",location.pathname+location.search)}
const welcome=`Я буду сам несколько раз в день искать, чем помочь тебе с проектами, и присылать идеи сюда. Можешь в любой момент написать мне или нажать «Найти сейчас».`;
function toast(x){const e=document.querySelector("#toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",3500)}
function fmt(t){return new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function markdown(s){let x=esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");return x.split("\n").map(a=>/^\s*[-•]\s/.test(a)||/^\s*\d+\.\s/.test(a)?`<div>${a}</div>`:a).join("<br>")}
function add(m){if(document.querySelector(`[data-id="${m.id}"]`))return;last=Math.max(last,m.t);let e=document.createElement("article");e.dataset.id=m.id;
if(m.kind==="idea"){let done=localStorage.getItem("idea_"+m.id);e.className="idea "+(done?"done":"");e.innerHTML=`<div class="idea-title">💡 ${esc(m.title)}</div><div>${markdown(m.text)}</div><div class="time">${fmt(m.t)}</div><div class="idea-actions"><button data-act="do">Сделай</button><button data-act="no">Не нужно</button></div>`;e.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(e.classList.contains("done"))return;localStorage.setItem("idea_"+m.id,"1");e.classList.add("done");send(b.dataset.act==="do"?`Разбери идею «${m.title}» и скажи, что конкретно делаем первым шагом`:`Идея «${m.title}» мне не подходит. Запомни и больше такое не предлагай.`)})}
else{e.className="msg "+(m.role==="user"?"user":"");let speech=m.role==="assistant"?`<button class="speak" title="Прочитать">🔊</button>`:"";e.innerHTML=`<div class="bubble">${speech}${markdown(m.text)}<div class="time">${fmt(m.t)}</div></div>`;e.querySelector(".speak")?.addEventListener("click",()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(m.text);u.lang="ru-RU";speechSynthesis.speak(u)})}
feedEl.append(e)}
function loadingBubble(){let e=document.createElement("div");e.id="thinking";e.className="msg";e.innerHTML='<div class="bubble">Думаю…</div>';feedEl.append(e);e.scrollIntoView({behavior:"smooth",block:"end"})}
async function api(path,opt={}){if(!token)throw Error("нет токена");let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),300000);try{let r=await fetch(API+path,{...opt,signal:ctrl.signal,headers:{"content-type":"application/json","X-PA-Token":token,...(opt.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}finally{clearTimeout(timer)}}
async function load(){if(!token){feedEl.innerHTML=`<div class="welcome">Откройте ссылку доступа</div>`;return}try{let d=await api("/pa/feed?after="+last);d.messages.forEach(add);if(!last&&!d.messages.length)feedEl.innerHTML=`<div class="welcome">${welcome}</div>`}catch(e){toast(e.message)}}
async function send(text){text=(text||input.value).trim();if(!text||loading)return;input.value="";resize();loading=true;loadingBubble();try{let d=await api("/pa/chat",{method:"POST",body:JSON.stringify({text})});document.querySelector("#thinking")?.remove();d.messages.forEach(add);window.scrollTo(0,document.body.scrollHeight)}catch(e){document.querySelector("#thinking")?.remove();add({id:"err"+Date.now(),t:Date.now(),role:"assistant",kind:"system",text:e.message})}finally{loading=false}}
async function scan(){let b=document.querySelector(".scan");b.classList.add("busy");b.querySelector(".scanword").textContent=" Ищу…";try{let d=await api("/pa/scan",{method:"POST"});d.messages?.forEach(add);toast(d.ideas?`Найдено идей: ${d.ideas}`:"Подходящих идей пока нет")}catch(e){toast(e.message)}finally{b.classList.remove("busy");b.querySelector(".scanword").textContent=""}}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"}
async function showNotes(){document.querySelector("#drawer").classList.add("open");let d=await api("/pa/notes");document.querySelector("#notesList").innerHTML=d.notes.map(n=>`<div class="note" data-note="${esc(n.id)}">${markdown(n.text)}<button>×</button></div>`).join("")||"Заметок пока нет";document.querySelectorAll(".note button").forEach(b=>b.onclick=async()=>{let id=b.parentNode.dataset.note;await api("/pa/notes-del",{method:"POST",body:JSON.stringify({id})});showNotes()})}
function b64(s){let p="=".repeat((4-s.length%4)%4),raw=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function push(){try{if(!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("Push не поддерживается");let p=await Notification.requestPermission();if(p!=="granted")throw Error("Разрешение не получено");let reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"}),d=await fetch(API+"/pa/vapid").then(r=>r.json()),sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(d.key)});await api("/pa/push-sub",{method:"POST",body:JSON.stringify({subscription:sub})});await api("/pa/push-test",{method:"POST"});toast("Уведомления включены")}catch(e){toast(e.message)}}
document.querySelector(".scan").onclick=scan;document.querySelector("#notesBtn").onclick=showNotes;document.querySelector("#closeDrawer").onclick=()=>document.querySelector("#drawer").classList.remove("open");document.querySelector("#pushBtn").onclick=push;document.querySelector("#composer").onsubmit=e=>{e.preventDefault();send()};input.oninput=resize;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>600){e.preventDefault();send()}};document.querySelector("#mic").onclick=()=>{let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return toast("Голосовой ввод недоступен");let r=new S;r.lang="ru-RU";r.onresult=e=>{input.value+=(input.value?" ":"")+e.results[0][0].transcript;resize()};r.start()};document.querySelector("#noteForm").onsubmit=async e=>{e.preventDefault();let x=document.querySelector("#noteInput");if(x.value.trim()){await api("/pa/notes",{method:"POST",body:JSON.stringify({text:x.value})});x.value="";showNotes()}};document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
</html>
