<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Советник</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#1b222c;--text:#edf2f7;--muted:#9ca8b8;--accent:#79c8a3;--line:#303b49;--idea:#d9a84f;--danger:#db7777}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;height:64px;background:#11151cf2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;backdrop-filter:blur(10px)}
h1{font-size:22px;margin:0}
.actions{display:flex;gap:3px;align-items:center}
button{border:0;border-radius:10px;background:var(--panel);color:var(--text);font:inherit;padding:9px 11px;cursor:pointer}
button:disabled{opacity:.45}
.icon{font-size:20px;padding:8px;background:transparent}
.install{display:none;color:var(--accent);font-size:14px;padding:8px}
.scan.busy .glass{display:none}
.spin{display:none}
.scan.busy .spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tabs{position:sticky;top:64px;z-index:4;display:flex;gap:7px;padding:8px 12px;background:#11151cf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.tab{padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#102018}
main{max-width:760px;margin:auto;padding:12px 12px 108px}
.welcome{color:var(--muted);text-align:center;margin:38px 12px}
.msg{display:flex;margin:9px 0}
.msg.user{justify-content:flex-end}
.bubble{position:relative;max-width:90%;padding:11px 14px;border-radius:17px;background:var(--panel);line-height:1.42;overflow-wrap:anywhere}
.user .bubble{background:#28513f}
.system .bubble{color:var(--muted);font-size:15px}
.unread .bubble{border:1px solid #75cba5;box-shadow:0 0 16px #75cba566}
.new-dot{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-right:7px;box-shadow:0 0 8px var(--accent)}
.time{font-size:12px;color:var(--muted);margin-top:8px}
.idea{display:block;border:1px solid #755b29;border-left:5px solid var(--idea);border-radius:13px;background:#211e17;padding:14px;margin:13px 0}
.idea.done{opacity:.45}
.idea-title{font-weight:700;color:#f2cf7b;margin-bottom:7px}
.idea-count{color:var(--muted);font-size:14px;margin-top:9px}
.idea-actions,.msg-actions{display:flex;gap:5px;flex-wrap:nowrap;margin-top:10px}
.idea-actions button,.msg-actions button{font-size:13px;padding:6px 8px;white-space:nowrap}
.speak{padding:2px 6px;background:transparent;color:var(--muted)}
.msg-actions .star,.idea-actions .star{margin-left:auto}
.long.collapsed .message-text{max-height:220px;overflow:hidden;position:relative}
.long.collapsed .message-text:after{content:"";position:absolute;left:0;right:0;bottom:0;height:55px;background:linear-gradient(transparent,var(--panel))}
.expand{margin-top:6px;background:transparent;color:var(--accent);padding:3px 0;font-size:14px}
.quote{color:#b9c5d1;border-left:3px solid var(--accent);padding-left:9px;margin-bottom:7px;font-size:14px}
.thread-screen{display:none}
.thread-screen.open{display:block;position:fixed;inset:0;z-index:3;background:var(--bg,#11151c);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(12px,calc((100% - 760px)/2 + 12px)) 90px}
body.thread-open{overflow:hidden}
.thread-head{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.thread-head h2{font-size:21px;margin:0;flex:1}
.thread-idea{border:1px solid #755b29;border-left:5px solid var(--idea);border-radius:13px;background:#211e17;padding:14px;margin-bottom:16px}
.thread-idea .idea-actions{margin-top:12px}
.thread-list{padding-bottom:80px}
.thread-compose{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#11151cf2;border-top:1px solid var(--line);padding:9px max(10px,calc((100% - 760px)/2 + 10px));display:none;gap:7px;align-items:end;backdrop-filter:blur(10px)}
.thread-screen.open~.thread-compose{display:flex}
#composer{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#11151cf2;border-top:1px solid var(--line);padding:9px max(10px,calc((100% - 760px)/2 + 10px));display:flex;gap:7px;align-items:end;backdrop-filter:blur(10px)}
textarea{resize:none;min-height:43px;max-height:130px;flex:1;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font:inherit;padding:9px 11px;outline:none}
#drawer{position:fixed;z-index:10;right:0;top:0;bottom:0;width:min(92vw,430px);background:var(--bg);box-shadow:-8px 0 30px #0008;padding:18px;transform:translateX(105%);transition:.25s;overflow:auto}
#drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.note{border-bottom:1px solid var(--line);padding:12px 0}
.note button{float:right;padding:2px 7px;color:var(--muted)}
.addnote{display:flex;gap:6px;margin-top:18px}
.addnote input{min-width:0;flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}
.toast{position:fixed;z-index:20;bottom:78px;left:50%;transform:translateX(-50%);background:#273442;padding:10px 15px;border-radius:10px;display:none;max-width:90%;text-align:center}
@media(max-width:600px){.actions{gap:0}.install{font-size:13px;padding:7px 5px}.bubble{max-width:94%}.msg-actions button,.idea-actions button{font-size:12px;padding:6px}.tabs{top:64px}}
</style>
</head>
<body>
<header>
  <h1>Советник</h1>
  <div class="actions">
    <button class="install" id="installBtn" title="Установить приложение">Установить</button>
    <button class="icon scan" title="Найти сейчас"><span class="glass">⌕</span><span class="spin">◌</span><span class="scanword"></span></button>
    <button class="icon" id="refreshBtn" title="Обновить">↻</button>
    <button class="icon" id="notesBtn" title="Заметки">☷</button>
    <button class="icon" id="pushBtn" title="Уведомления">♧</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-filter="all">Все</button>
  <button class="tab" data-filter="idea">Идеи</button>
  <button class="tab" data-filter="star">⭐ Закладки</button>
</nav>

<main id="feed"></main>

<section id="threadScreen" class="thread-screen">
  <main>
    <div class="thread-head">
      <button id="threadBack" class="icon" title="Назад">‹</button>
      <h2>Обсуждение</h2>
    </div>
    <div id="threadIdea"></div>
    <div id="threadList" class="thread-list"></div>
  </main>
</section>

<form id="composer">
  <button type="button" class="icon" id="mic" title="Голосовой ввод">♩</button>
  <textarea id="input" rows="1" placeholder="Напиши Советнику..."></textarea>
  <button class="icon" title="Отправить">➤</button>
</form>

<form id="threadComposer" class="thread-compose">
  <button type="button" class="icon" id="threadMic" title="Голосовой ввод">♩</button>
  <textarea id="threadInput" rows="1" placeholder="Обсудить идею..."></textarea>
  <button class="icon" title="Отправить">➤</button>
</form>

<aside id="drawer">
  <div class="drawer-head"><h2>Заметки</h2><button id="closeDrawer">×</button></div>
  <div id="notesList"></div>
  <form class="addnote" id="noteForm">
    <input id="noteInput" placeholder="Добавить заметку">
    <button>Добавить</button>
  </form>
</aside>
<div class="toast" id="toast"></div>

<script>
const API="https://pomoshnik.jagser.deno.net";
const feedEl=document.querySelector("#feed");
const input=document.querySelector("#input");
const threadInput=document.querySelector("#threadInput");
const tokenKey="pa_token";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=localStorage.getItem(tokenKey),last=0,loading=false,threadLoading=false;
let allMessages=new Map(),activeThread=null,installPrompt=null,currentAudio=null;
const audioCache=new Map();
const filterKey="pa_filter";
let currentFilter=localStorage.getItem(filterKey)||"all";
const lastSeenKey="pa_lastSeen";
let lastSeen=Number(localStorage.getItem(lastSeenKey)||0);

if(location.hash.startsWith("#k=")){
  token=decodeURIComponent(location.hash.slice(3));
  localStorage.setItem(tokenKey,token);
  history.replaceState(null,"",location.pathname+location.search);
}

const welcome="Я буду сам несколько раз в день искать, чем помочь тебе с проектами, и присылать идеи сюда. Можешь в любой момент написать мне или нажать «Найти сейчас».";

function toast(x){
  const e=document.querySelector("#toast");
  e.textContent=x;
  e.style.display="block";
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>e.style.display="none",3500);
}

function fmt(t){
  const d=new Date(t),now=new Date();
  const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const time=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  if(same(d,now))return "сегодня "+time;
  const y=new Date(now);y.setDate(y.getDate()-1);
  if(same(d,y))return "вчера "+time;
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+" "+time;
}

function cleanSpeech(s){
  return String(s||"")
    .replace(/```[\s\S]*?```/g,"")
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,"$1")
    .replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
    .replace(/[*_~`>#]/g,"")
    .replace(/^\s*[-•]\s+/gm,"")
    .replace(/^\s*\d+\.\s+/gm,"")
    .replace(/\s+/g," ")
    .trim();
}

function markdown(s){
  let x=esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  return x.split("\n").map(a=>/^\s*[-•]\s/.test(a)||/^\s*\d+\.\s/.test(a)?`<div>${a}</div>`:a).join("<br>");
}

function isUnread(m){
  return m.role==="assistant"&&!m.thread&&m.t>lastSeen;
}

function updateBadge(){
  if(!("setAppBadge"in navigator)&&!("clearAppBadge"in navigator))return;
  const n=[...allMessages.values()].filter(isUnread).length;
  try{
    if(n&&navigator.setAppBadge)navigator.setAppBadge(n);
    else if(!n&&navigator.clearAppBadge)navigator.clearAppBadge();
  }catch{}
}

function markSeen(m,e){
  if(!isUnread(m)||e.dataset.seeing)return;
  e.dataset.seeing="1";
  setTimeout(()=>{
    if(!document.body.contains(e))return;
    lastSeen=Math.max(lastSeen,m.t);
    localStorage.setItem(lastSeenKey,String(lastSeen));
    e.classList.remove("unread");
    updateBadge();
  },4000);
}

const observer="IntersectionObserver"in window?new IntersectionObserver(entries=>{
  for(const x of entries)if(x.isIntersecting)markSeen(x.target._message,x.target);
},{threshold:.35}):null;

function actionButton(label,title,action,cls=""){
  return `<button class="${cls}" data-action="${action}" title="${esc(title)}">${label}</button>`;
}

function renderMessage(m,container=feedEl){
  if(container.querySelector(`[data-id="${CSS.escape(m.id)}"]`))return;
  const e=document.createElement("article");
  e.dataset.id=m.id;
  e._message=m;

  if(m.kind==="idea"){
    e.className="idea "+(localStorage.getItem("idea_"+m.id)?"done ":"");
    e.innerHTML=`
      <div class="idea-title">💡 ${esc(m.title||"Идея")}</div>
      <div>${markdown(m.text)}</div>
      <div class="time">${fmt(m.t)}</div>
      <div class="idea-count">${m.threadCount?"💬 "+m.threadCount:""}</div>
      <div class="idea-actions">
        ${actionButton("Обсудить","Открыть обсуждение","discuss")}
        ${actionButton("Сделай","Сделать","do")}
        ${actionButton("Не нужно","Не нужно","no")}
        ${actionButton("🔊","Озвучить","speak","speak")}
        ${actionButton("⧉","Копировать","copy")}
        ${actionButton(m.starred?"★":"☆",m.starred?"Убрать из закладок":"Добавить в закладки","star","star")}
      </div>`;
    e.addEventListener("click",ev=>{
      const b=ev.target.closest("button");
      if(!b){openThread(m);return;}
      ev.stopPropagation();
      const a=b.dataset.action;
      if(a==="discuss")openThread(m);
      if(a==="star")toggleStar(m,e);
      if(a==="do"||a==="no")ideaDecision(m,e,a);
      if(a==="speak")speakMessage(m,b);
      if(a==="copy")copyText((m.title?m.title+". ":"")+m.text);
    });
  }else{
    e.className="msg "+(m.role==="user"?"user ":"")+(m.role==="assistant"&&isUnread(m)?"unread ":"");
    const assistant=m.role==="assistant";
    const long=assistant&&m.text.length>900;
    const speech=assistant?actionButton("🔊","Озвучить","speak","speak"):"";
    const star=actionButton(m.starred?"★":"☆",m.starred?"Убрать из закладок":"Добавить в закладки","star","star");
    e.innerHTML=`
      <div class="bubble ${long?"long collapsed":""}">
        ${assistant&&isUnread(m)?'<span class="new-dot" title="Новое"></span>':""}
        <div class="message-text">${markdown(m.text)}</div>
        ${long?'<button class="expand">Показать полностью</button>':""}
        <div class="time">${fmt(m.t)}</div>
        <div class="msg-actions">
          ${speech}
          ${assistant?actionButton("⧉","Копировать","copy"):""}
          ${actionButton("↩","Ответить","reply")}
          ${star}
        </div>
      </div>`;
    e.addEventListener("click",ev=>{
      const b=ev.target.closest("button");
      if(!b)return;
      const a=b.dataset.action;
      if(a==="speak")speakMessage(m,b);
      if(a==="copy")copyText(m.text);
      if(a==="reply")replyTo(m.text);
      if(a==="star")toggleStar(m,e);
      if(b.classList.contains("expand")){
        e.querySelector(".bubble").classList.toggle("collapsed");
        b.textContent=e.querySelector(".bubble").classList.contains("collapsed")?"Показать полностью":"Свернуть";
      }
    });
  }

  container.prepend(e);
  if(observer&&m.role==="assistant"&&!m.thread)observer.observe(e);
}

function renderFeed(){
  feedEl.innerHTML="";
  let list=[...allMessages.values()].filter(m=>!m.thread);
  if(currentFilter==="idea")list=list.filter(m=>m.kind==="idea");
  if(currentFilter==="star")list=list.filter(m=>m.starred);
  list.sort((a,b)=>b.t-a.t);
  if(!list.length){
    feedEl.innerHTML=`<div class="welcome">${currentFilter==="star"?"Закладок пока нет":welcome}</div>`;
  }else{
    for(const m of list)renderMessage(m,feedEl);
  }
  updateBadge();
}

function add(m){
  if(!m||!m.id)return;
  const old=allMessages.get(m.id);
  allMessages.set(m.id,{...old,...m});
  last=Math.max(last,m.t||0);
  if(activeThread){
    if(m.thread===activeThread)renderThread();
  }else renderFeed();
}

function thinking(container,id="thinking"){
  container.querySelector("#"+id)?.remove();
  const e=document.createElement("div");
  e.id=id;e.className="msg";
  e.innerHTML='<div class="bubble">Думаю…</div>';
  container.prepend(e);
}

async function api(path,opt={}){
  if(!token)throw Error("Откройте ссылку доступа");
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),300000);
  try{
    const r=await fetch(API+path,{...opt,signal:ctrl.signal,headers:{
      "content-type":"application/json","X-PA-Token":token,...(opt.headers||{})
    }});
    let d={};
    try{d=await r.json()}catch{}
    if(!r.ok)throw Error(d.error||"Ошибка сети");
    return d;
  }finally{clearTimeout(timer)}
}

async function load(){
  if(!token){feedEl.innerHTML='<div class="welcome">Откройте ссылку доступа</div>';return}
  try{
    const d=await api("/pa/feed?after="+last);
    d.messages.forEach(m=>allMessages.set(m.id,m));
    d.messages.forEach(m=>{last=Math.max(last,m.t||0)});
    if(activeThread)renderThread();else renderFeed();
  }catch(e){toast("Не удалось обновить ленту")}
}

async function refresh(){
  if(loading)return;
  try{
    const d=await api("/pa/feed?after=0");
    allMessages.clear();last=0;
    d.messages.forEach(m=>{allMessages.set(m.id,m);last=Math.max(last,m.t||0)});
    if(activeThread)renderThread();else renderFeed();
    toast("Лента обновлена");
  }catch{toast("Не удалось обновить ленту")}
}

function optimisticUser(text,thread=""){
  const m={id:"local-"+Date.now(),t:Date.now(),role:"user",kind:"chat",text,thread};
  if(thread){allMessages.set(m.id,m);renderThread()}
  else{allMessages.set(m.id,m);renderFeed()}
  return m;
}

async function send(text,thread=""){
  const area=thread?threadInput:input;
  text=(text||area.value).trim();
  if(!text||(thread?threadLoading:loading))return;
  area.value;area.value="";resize(area);
  const busyId=thread?"thread-thinking":"thinking";
  if(thread)threadLoading=true;else loading=true;
  optimisticUser(text,thread);
  const list=thread?document.querySelector("#threadList"):feedEl;
  thinking(list,busyId);
  try{
    const d=await api("/pa/chat",{method:"POST",body:JSON.stringify({text,thread:thread||undefined})});
    list.querySelector("#"+busyId)?.remove();
    d.messages.forEach(add);
    if(thread)renderThread();else renderFeed();
    window.scrollTo({top:0,behavior:"smooth"});
  }catch{
    list.querySelector("#"+busyId)?.remove();
    const err={id:"err-"+Date.now(),t:Date.now(),role:"assistant",kind:"system",text:"Не удалось получить ответ.",thread};
    add(err);
    toast("Сеть недоступна");
  }finally{
    if(thread)threadLoading=false;else loading=false;
  }
}

async function retryMessage(m){
  const text=m.text;
  allMessages.delete(m.id);
  if(m.thread)renderThread();else renderFeed();
  await send(text,m.thread||"");
}

async function scan(){
  const b=document.querySelector(".scan");
  b.classList.add("busy");b.querySelector(".scanword").textContent=" Ищу…";
  try{
    const d=await api("/pa/scan",{method:"POST"});
    d.messages?.forEach(add);
    toast(d.ideas?`Найдено идей: ${d.ideas}`:"Подходящих идей пока нет");
  }catch{toast("Не удалось выполнить поиск")}
  finally{b.classList.remove("busy");b.querySelector(".scanword").textContent=""}
}

function resize(area){
  area.style.height="auto";
  area.style.height=Math.min(area.scrollHeight,130)+"px";
}

async function toggleStar(m,e){
  const old=!!m.starred;
  m.starred=!old;
  allMessages.set(m.id,m);
  renderFeed();
  if(activeThread)renderThread();
  try{
    await api("/pa/star",{method:"POST",body:JSON.stringify({id:m.id,on:m.starred})});
  }catch{
    m.starred=old;allMessages.set(m.id,m);
    renderFeed();if(activeThread)renderThread();
    toast("Не удалось изменить закладку");
  }
}

function copyText(text){
  navigator.clipboard?.writeText(text).then(()=>toast("Скопировано")).catch(()=>toast("Не удалось скопировать"));
}

function replyTo(text,area=input){
  const q=cleanSpeech(text).slice(0,120);
  area.value=`По поводу: «${q}${cleanSpeech(text).length>120?"…":""}» `;
  resize(area);area.focus();
}

function ideaDecision(m,e,a){
  if(e.classList.contains("done"))return;
  localStorage.setItem("idea_"+m.id,"1");
  e.classList.add("done");
  const text=a==="do"
    ?`Разбери идею «${m.title}» и скажи, что конкретно делаем первым шагом`
    :`Идея «${m.title}» мне не подходит. Запомни и больше такое не предлагай.`;
  openThread(m).then(()=>send(text,m.id));
}

async function speakMessage(m,button){
  if(currentAudio?.id===m.id){
    currentAudio.audio.pause();
    currentAudio.audio.currentTime=0;
    currentAudio=null;
    button.textContent="🔊";
    return;
  }
  if(currentAudio){
    currentAudio.audio.pause();
    currentAudio.button.textContent="🔊";
    currentAudio=null;
  }
  button.textContent="⏳";
  try{
    let audio=audioCache.get(m.id);
    if(!audio){
      const text=m.kind==="idea"?`${m.title}. ${m.text}`:m.text;
      const r=await fetch(API+"/pa/tts",{method:"POST",headers:{
        "content-type":"application/json","X-PA-Token":token
      },body:JSON.stringify({text:cleanSpeech(text).slice(0,5000)})});
      if(!r.ok)throw Error();
      audio=new Audio(URL.createObjectURL(await r.blob()));
      audioCache.set(m.id,audio);
    }
    currentAudio={id:m.id,audio,button};
    button.textContent="■";
    audio.onended=()=>{if(currentAudio?.id===m.id)currentAudio=null;button.textContent="🔊"};
    await audio.play();
  }catch{
    button.textContent="🔊";
    currentAudio=null;
    toast("Gemini недоступен, включена системная озвучка");
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(cleanSpeech(m.kind==="idea"?`${m.title}. ${m.text}`:m.text));
      u.lang="ru-RU";speechSynthesis.speak(u);
    }catch{}
  }
}

async function openThread(m){
  activeThread=m.id;
  document.querySelector("#threadScreen").classList.add("open");document.body.classList.add("thread-open");document.querySelector("#threadScreen").scrollTop=0;
  document.querySelector("#composer").style.display="none";
  document.querySelector("#threadIdea").innerHTML=`
    <div class="thread-idea">
      <div class="idea-title">💡 ${esc(m.title)}</div>
      <div>${markdown(m.text)}</div>
      <div class="time">${fmt(m.t)}</div>
      <div class="idea-actions">
        ${actionButton("🔊","Озвучить","speak")}
        ${actionButton(m.starred?"★":"☆",m.starred?"Убрать из закладок":"Добавить в закладки","star","star")}
        ${actionButton("Сделай","Сделать","do")}
        ${actionButton("Не нужно","Не нужно","no")}
      </div>
    </div>`;
  const box=document.querySelector("#threadIdea");
  box.onclick=ev=>{
    const b=ev.target.closest("button");if(!b)return;
    if(b.dataset.action==="speak")speakMessage(m,b);
    if(b.dataset.action==="star")toggleStar(m,box);
    if(b.dataset.action==="do"||b.dataset.action==="no"){
      const text=b.dataset.action==="do"
        ?`Разбери идею «${m.title}» и скажи, что конкретно делаем первым шагом`
        :`Идея «${m.title}» мне не подходит. Запомни и больше такое не предлагай.`;
      send(text,m.id);
    }
  };
  history.pushState({thread:m.id},"",`#thread-${encodeURIComponent(m.id)}`);
  renderThread();
}

function renderThread(){
  if(!activeThread)return;
  const list=document.querySelector("#threadList");
  list.innerHTML="";
  const items=[...allMessages.values()].filter(m=>m.thread===activeThread).sort((a,b)=>b.t-a.t);
  if(!items.length)list.innerHTML='<div class="welcome">Здесь можно обсудить идею, задать вопрос или попросить развить тему.</div>';
  else for(const m of items)renderMessage(m,list);
}

function closeThread(fromPop=false){
  if(!activeThread)return;
  activeThread=null;
  document.querySelector("#threadScreen").classList.remove("open");document.body.classList.remove("thread-open");
  document.querySelector("#composer").style.display="flex";
  if(!fromPop&&location.hash.startsWith("#thread-"))history.back();
  renderFeed();
}

async function showNotes(){
  document.querySelector("#drawer").classList.add("open");
  try{
    const d=await api("/pa/notes");
    document.querySelector("#notesList").innerHTML=d.notes.map(n=>`
      <div class="note" data-note="${esc(n.id)}">${markdown(n.text)}<button>×</button></div>`).join("")||"Заметок пока нет";
    document.querySelectorAll(".note button").forEach(b=>b.onclick=async()=>{
      const id=b.parentNode.dataset.note;
      try{await api("/pa/notes-del",{method:"POST",body:JSON.stringify({id})});showNotes()}catch{toast("Не удалось удалить заметку")}
    });
  }catch{toast("Не удалось загрузить заметки")}
}

function b64(s){
  const p="=".repeat((4-s.length%4)%4);
  const raw=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}

async function push(){
  try{
    if(!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("Push не поддерживается");
    const p=await Notification.requestPermission();
    if(p!=="granted")throw Error("Разрешение не получено");
    const reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
    const d=await fetch(API+"/pa/vapid").then(r=>r.json());
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(d.key)});
    await api("/pa/push-sub",{method:"POST",body:JSON.stringify({subscription:sub})});
    await api("/pa/push-test",{method:"POST"});
    toast("Уведомления включены");
  }catch(e){toast(e.message||"Push недоступен")}
}

function setupInstall(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(standalone)return;
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();installPrompt=e;
    document.querySelector("#installBtn").style.display="block";
  });
  window.addEventListener("appinstalled",()=>{
    installPrompt=null;document.querySelector("#installBtn").style.display="none";
  });
}

document.querySelector("#installBtn").onclick=async()=>{
  if(installPrompt){
    installPrompt.prompt();
    const r=await installPrompt.userChoice;
    if(r.outcome==="accepted")document.querySelector("#installBtn").style.display="none";
    installPrompt=null;
  }else toast("Нажмите «Поделиться» → «На экран Домой»");
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  currentFilter=b.dataset.filter;
  localStorage.setItem(filterKey,currentFilter);
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  renderFeed();
});
document.querySelector(`.tab[data-filter="${currentFilter}"]`)?.classList.add("active");
document.querySelector(".scan").onclick=scan;
document.querySelector("#refreshBtn").onclick=refresh;
document.querySelector("#notesBtn").onclick=showNotes;
document.querySelector("#closeDrawer").onclick=()=>document.querySelector("#drawer").classList.remove("open");
document.querySelector("#pushBtn").onclick=push;
document.querySelector("#threadBack").onclick=()=>closeThread();

document.querySelector("#composer").onsubmit=e=>{e.preventDefault();send()};
document.querySelector("#threadComposer").onsubmit=e=>{e.preventDefault();send("",activeThread)};
input.oninput=()=>resize(input);
threadInput.oninput=()=>resize(threadInput);
input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>600){e.preventDefault();send()}};
threadInput.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>600){e.preventDefault();send("",activeThread)}};

function voiceInput(area){
  const S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S)return toast("Голосовой ввод недоступен");
  const r=new S();
  r.lang="ru-RU";
  r.onresult=e=>{area.value+=(area.value?" ":"")+e.results[0][0].transcript;resize(area)};
  r.onerror=()=>toast("Не удалось распознать речь");
  r.start();
}
document.querySelector("#mic").onclick=()=>voiceInput(input);
document.querySelector("#threadMic").onclick=()=>voiceInput(threadInput);

document.querySelector("#noteForm").onsubmit=async e=>{
  e.preventDefault();
  const x=document.querySelector("#noteInput");
  if(!x.value.trim())return;
  try{
    await api("/pa/notes",{method:"POST",body:JSON.stringify({text:x.value})});
    x.value="";showNotes();
  }catch{toast("Не удалось сохранить заметку")}
};

window.addEventListener("popstate",()=>{
  if(activeThread)closeThread(true);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});
setupInstall();
load();
setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
</html>
