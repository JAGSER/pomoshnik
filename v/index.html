<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вам прислали ролик · Помощник AI</title>
<meta name="description" content="Короткий ролик с озвучкой. Откройте, чтобы посмотреть и ответить.">
<meta property="og:title" content="🎬 Вам прислали ролик">
<meta property="og:description" content="Откройте, чтобы посмотреть и ответить">
<meta property="og:image" content="https://pomoshnik.ai/icon-512.png">
<meta property="og:type" content="video.other">
<meta name="theme-color" content="#F6F1E9">
<link rel="icon" href="../icon.svg">
<style>
:root { --bg: #F6F1E9; --surface: #FFFDF9; --ink: #1F1B16; --muted: #6E655A; --line: #E4DACB; --accent: #B5532E; --accent-ink: #fff; --accent-soft: #F3E1D6; }
@media (prefers-color-scheme: dark) { :root { --bg: #1B1814; --surface: #25211C; --ink: #F2ECE3; --muted: #A99F92; --line: #3A342C; --accent: #E07A50; --accent-ink: #1B1814; --accent-soft: #3B2A21; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 520px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
.brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; text-decoration: none; margin-bottom: 12px; }
.brand img { width: 28px; height: 28px; border-radius: 8px; }
h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
.from { color: var(--muted); margin: 0 0 12px; }
.player { position: relative; border-radius: 22px; overflow: hidden; background: #000; aspect-ratio: 9 / 16; max-height: 72vh; margin: 0 auto; }
video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
.caption { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
.row { display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
button, .btn { font: inherit; border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; }
.heart { background: var(--accent-soft); color: var(--accent); font-weight: 700; flex: 1; }
.heart.done { background: var(--accent); color: var(--accent-ink); }
.views { color: var(--muted); font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin: 16px 0; }
.card h2 { font-size: 18px; margin: 0 0 10px; }
textarea, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; }
textarea { min-height: 84px; resize: vertical; }
input { margin-top: 8px; }
.send { background: var(--accent); color: var(--accent-ink); font-weight: 700; width: 100%; margin-top: 10px; }
.ok { color: var(--accent); font-weight: 700; margin-top: 8px; }
.cta { display: flex; flex-direction: column; gap: 2px; width: 100%; background: var(--ink); color: var(--bg); font-weight: 700; margin-top: 6px; }
.cta small { font-weight: 400; opacity: .8; }
.err { text-align: center; padding: 60px 10px; color: var(--muted); }
button:focus-visible, .btn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="../"><img src="../icon-192.png" alt=""><span>Помощник AI</span></a>
  <div id="main" hidden>
    <h1 id="title"></h1>
    <p class="from" id="from"></p>
    <div class="player"><video id="video" controls playsinline preload="metadata"></video></div>
    <div class="caption" id="caption" hidden></div>
    <div class="row">
      <button class="heart" id="heart" type="button">❤️ <span id="heart-label">Понравилось</span></button>
      <span class="views" id="views"></span>
    </div>
    <div class="card">
      <h2 id="reply-title">Ответить</h2>
      <textarea id="reply" placeholder="Напишите пару слов"></textarea>
      <input id="name" placeholder="Ваше имя" autocomplete="name">
      <button class="send" id="send" type="button">Отправить ответ</button>
      <div class="ok" id="sent" hidden></div>
    </div>
    <a class="btn cta" id="cta" href="../">🎬 Сделать свой ролик <small id="cta-sub">в «Помощник AI»</small></a>
  </div>
  <div class="err" id="err" hidden></div>
</div>
<script>
const ID = (location.search.slice(1).match(/[A-Za-z0-9]{8}/) || [""])[0];
const $ = (s) => document.getElementById(s);
let PROXY = "https://pomoshnik.jagser.deno.net", EN = false, META = null;
const L = (ru, en) => (EN ? en : ru);
function counts(c) {
  if (!c) return;
  $("views").textContent = c.views ? L(`👀 ${c.views} просмотр${c.views % 10 === 1 && c.views % 100 !== 11 ? "" : c.views % 10 >= 2 && c.views % 10 <= 4 && (c.views % 100 < 10 || c.views % 100 >= 20) ? "а" : "ов"}`, `👀 ${c.views} view${c.views === 1 ? "" : "s"}`) : "";
  if (c.hearts && !$("heart").classList.contains("done")) $("heart-label").textContent = L(`Понравилось · ${c.hearts}`, `Like · ${c.hearts}`);
}
async function post(path, body) {
  const r = await fetch(PROXY + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "ошибка");
  return d;
}
(async () => {
  try { const c = await (await fetch("../config.json", { cache: "no-store" })).json(); if (c.proxy) PROXY = c.proxy; } catch (_) {}
  if (!ID) return fail("Ссылка неполная. Попросите прислать её ещё раз.");
  try {
    const r = await fetch(`${PROXY}/video-meta/${ID}`);
    if (!r.ok) return fail("Ролик не найден или срок его хранения закончился.");
    META = await r.json();
  } catch (_) { return fail("Нет связи. Проверьте интернет и обновите страницу."); }
  EN = META.lang === "en"; document.documentElement.lang = EN ? "en" : "ru";
  document.title = (META.title || L("Ролик", "Video")) + " · Pomoshnik AI";
  $("title").textContent = META.title || L("Ролик для вас", "A video for you");
  $("from").textContent = META.name ? L(`🎁 Ролик для вас от: ${META.name}`, `🎁 A video for you from ${META.name}`) : L("🎁 Вам прислали этот ролик", "🎁 Someone sent you this video");
  if (META.caption) { $("caption").textContent = META.caption; $("caption").hidden = false; }
  const v = $("video");
  v.src = `${PROXY}/video/${ID}.${META.type === "video/webm" ? "webm" : "mp4"}`;
  if (META.poster) v.poster = `${PROXY}/video/${ID}.jpg`;
  // что сообщает сам телефон: часовой пояс, язык, устройство, приложение, имя (если человек его оставлял)
  const ua = navigator.userAgent;
  const info = () => {
    let viewer = "", name = "";
    try { name = localStorage.getItem("replyName") || ""; const ss = JSON.parse(localStorage.getItem("session") || "null"); if (ss && ss.user) { viewer = ss.user; const pf = JSON.parse(localStorage.getItem("profile:" + ss.user) || "null"); if (!name && pf && pf.name) name = pf.name; } } catch (_) {}
    return {
      tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ""), lang: navigator.language || "",
      os: /iPhone|iPad|iPod/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS/.test(ua) ? "Mac" : "",
      app: /WhatsApp/i.test(ua) ? "WhatsApp" : /Telegram/i.test(ua) ? "Telegram" : /Instagram/i.test(ua) ? "Instagram" : /FBAN|FBAV/.test(ua) ? "Facebook" : /vkclient|VKAndroidApp/i.test(ua) ? "VK" : /Line\//.test(ua) ? "Line" : "",
      name, viewer,
    };
  };
  let counted = false, viewKey = null, maxPct = 0, sentPct = -1;
  const sendPct = () => {
    if (!viewKey || maxPct === sentPct) return; sentPct = maxPct;
    const body = JSON.stringify({ id: ID, key: viewKey, pct: maxPct });
    try { if (navigator.sendBeacon && navigator.sendBeacon(PROXY + "/video-watch", new Blob([body], { type: "text/plain" }))) return; } catch (_) {}
    fetch(PROXY + "/video-watch", { method: "POST", body, keepalive: true }).catch(() => {});
  };
  v.addEventListener("play", () => {
    if (counted) return; counted = true;
    post("/video-view", { id: ID, ...info() }).then((c) => { viewKey = c.key; counts(c); }).catch(() => {});
  });
  v.addEventListener("timeupdate", () => { if (v.duration) maxPct = Math.max(maxPct, Math.round((v.currentTime / v.duration) * 100)); if (maxPct - sentPct >= 25) sendPct(); });
  v.addEventListener("ended", () => { maxPct = 100; sendPct(); });
  v.addEventListener("pause", sendPct);
  document.addEventListener("visibilitychange", () => { if (document.hidden) sendPct(); });
  addEventListener("pagehide", sendPct);
  $("heart-label").textContent = L("Понравилось", "Like");
  $("reply-title").textContent = L("✍️ Ответить", "✍️ Reply");
  if (META.name) $("reply").placeholder = L(`Напишите пару слов. Ваш ответ увидит: ${META.name}`, `Write a few words. ${META.name} will see your reply`);
  if (!META.name) $("reply").placeholder = L("Напишите пару слов", "Write a few words");
  $("name").placeholder = L("Ваше имя", "Your name");
  $("send").textContent = L("Отправить ответ", "Send reply");
  $("cta").firstChild.nodeValue = L("🎬 Сделать свой ролик ", "🎬 Make your own video ");
  $("cta-sub").textContent = L("в «Помощник AI»", "with Pomoshnik AI");
  try { $("name").value = localStorage.getItem("replyName") || ""; } catch (_) {}
  const liked = (() => { try { return localStorage.getItem("liked:" + ID) === "1"; } catch (_) { return false; } })();
  if (liked) { $("heart").classList.add("done"); $("heart-label").textContent = L("Вам понравилось", "You liked it"); }
  counts(META);
  $("main").hidden = false;
  $("heart").onclick = async () => {
    if ($("heart").classList.contains("done")) return;
    $("heart").classList.add("done"); $("heart-label").textContent = L("Спасибо!", "Thank you!");
    try { localStorage.setItem("liked:" + ID, "1"); } catch (_) {}
    try { const c = await post("/video-react", { id: ID, kind: "heart" }); counts(c); } catch (_) {}
  };
  $("send").onclick = async () => {
    const text = $("reply").value.trim(), name = $("name").value.trim();
    if (!text) { $("reply").focus(); return; }
    $("send").disabled = true;
    try {
      await post("/video-react", { id: ID, kind: "reply", text, name });
      try { localStorage.setItem("replyName", name); } catch (_) {}
      $("reply").value = ""; $("sent").hidden = false;
      $("sent").textContent = L("Отправлено ❤️", "Sent ❤️");
    } catch (e) { $("sent").hidden = false; $("sent").textContent = L("Не отправилось: ", "Not sent: ") + e.message; }
    $("send").disabled = false;
  };
})();
function fail(t) { $("err").textContent = t; $("err").hidden = false; }
</script>
</body>
</html>
